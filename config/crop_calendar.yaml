# Crop list and season context for the Maharashtra pilot.
#
# reviewed: false  → CropPulse shows "days after sowing" only and does NOT name a
# growth stage. Stage tables must come from an official crop calendar (e.g. state
# agriculture department / ICAR / SAU package of practices) and be reviewed by an
# agronomist before `reviewed` is set to true and `stages` populated.

reviewed: false
source: null
crops:
  soybean:   {seasons: [kharif]}
  cotton:    {seasons: [kharif]}
  pigeonpea: {seasons: [kharif]}
  maize:     {seasons: [kharif, rabi]}
  rice:      {seasons: [kharif]}
  sorghum:   {seasons: [kharif, rabi]}
  pearl_millet: {seasons: [kharif]}
  green_gram:   {seasons: [kharif]}
  black_gram:   {seasons: [kharif]}
  wheat:     {seasons: [rabi]}
  chickpea:  {seasons: [rabi]}
  sugarcane: {seasons: [annual]}
  onion:     {seasons: [kharif, rabi]}
  other:     {seasons: [kharif, rabi, zaid, annual]}

