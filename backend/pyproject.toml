[project]
name = "croppulse"
version = "0.1.0"
description = "CropPulse backend: satellite/weather crop-stress screening and decision-support API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "shapely>=2.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["croppulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits real external services (NASA POWER, ORNL MODIS); run with -m live",
]
addopts = "-m 'not live' -q"
filterwarnings = ["ignore::DeprecationWarning:httpx"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "S105", "S106", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
